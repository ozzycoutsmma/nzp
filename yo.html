<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S25 Personal WebGPU AI</title>
    <style>
        :root { --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --accent: #a8c7fa; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #303132; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #303132; color: #fff; }
        .ai { align-self: flex-start; background: var(--card); border: 1px solid #444746; }
        #input-area { padding: 15px; display: flex; gap: 10px; background: var(--bg); border-top: 1px solid #303132; }
        input { flex: 1; padding: 14px; border: 1px solid #444746; border-radius: 25px; background: var(--card); color: white; font-size: 16px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; }
        #status { padding: 8px; font-size: 12px; text-align: center; background: #282a2d; color: #aaa; }
        #console { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; height: 120px; overflow-y: auto; border-top: 2px solid #333; }
    </style>
</head>
<body>

    <header>S25 Personal WebGPU AI</header>
    <div id="status">Testing system pipelines...</div>
    <div id="chat-box">
        <div class="msg ai">Hello! Let's download the model data over internet. Once the console below says "Model Ready", you can switch to Airplane Mode!</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>
    <div id="console">--- Live Engine Logs ---<br></div>

    <script type="module">
        // Import WebLLM directly into the main frame to bypass origin restrictions
        import * as webLLM from "https://jsdelivr.net";

        const statusDiv = document.getElementById("status");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const con = document.getElementById("console");

        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const color = isError ? "red" : "#0f0";
            con.innerHTML += `<span style="color: ${color}">[${time}] ${msg}</span><br>`;
            con.scrollTop = con.scrollHeight;
        }

        const selectedModel = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC"; 
        let engine;

        async function initAI() {
            try {
                log("Verifying WebGPU hardware layer...");
                if (!navigator.gpu) {
                    throw new Error("WebGPU object missing. Ensure chrome://flags are active.");
                }

                log("Connecting directly to local Engine pipeline...");
                // CreateEngine runs in the main thread directly, completely bypassing web_worker.js
                engine = await webLLM.CreateEngine(selectedModel, {
                    initProgressCallback: (report) => {
                        statusDiv.innerText = report.text;
                        log(`Loading weights: ${Math.round(report.progress * 100)}%`);
                    }
                });

                statusDiv.innerText = "Model Ready! Disconnect internet now.";
                log("SUCCESS: Engine compiled without background worker constraints.");
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "Engine Crash.";
                log(`CRITICAL: ${err.message}`, true);
                console.error(err);
            }
        }

        async function appendMessage(text, sender) {
            const msg = document.createElement("div");
            msg.className = `msg ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = "";
            await appendMessage(prompt, "user");

            userInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.innerText = "AI is thinking...";
            log("Processing generation query on device GPU...");

            const aiMsgBox = await appendMessage("", "ai");

            try {
                const chunks = await engine.chat.completions.create({
                    messages: [{ role: "user", content: prompt }],
                    stream: true
                });

                let replyText = "";
                for await (const chunk of chunks) {
                    const content = chunk.choices?.delta?.content || "";
                    replyText += content;
                    aiMsgBox.innerText = replyText;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (e) {
                log(`Generation Error: ${e.message}`, true);
                aiMsgBox.innerText = "Error compiling answers.";
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
            statusDiv.innerText = "Offline Mode Active";
            log("Generation sequence complete.");
        }

        sendBtn.addEventListener("click", handleSend);
        userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleSend(); });

        initAI();
    </script>
</body>
</html>
