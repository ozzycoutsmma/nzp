<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% On-Device WebGPU Chat</title>
    <style>
        :root { --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --accent: #a8c7fa; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #303132; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #303132; color: #fff; }
        .ai { align-self: flex-start; background: var(--card); border: 1px solid #444746; }
        #input-area { padding: 15px; display: flex; gap: 10px; background: var(--bg); }
        input { flex: 1; padding: 14px; border: 1px solid #444746; border-radius: 25px; background: var(--card); color: white; font-size: 16px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; }
        #status { padding: 8px; font-size: 12px; text-align: center; background: #282a2d; color: #aaa; }
    </style>
</head>
<body>

    <header>S25 Personal WebGPU AI</header>
    <div id="status">Initializing engine... WebGPU required.</div>
    <div id="chat-box">
        <div class="msg ai">Hello! Once the model finishes caching via internet the first time, you can turn off your mobile data/Wi-Fi completely and use me 100% offline.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <!-- Import WebLLM Logic using a global CDN script -->
    <script type="module">
        import { CreateWebWorkerEngine } from "https://jsdelivr.net";

        const statusDiv = document.getElementById("status");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        // We choose a tiny, hyper-optimized 0.5B model so it loads instantly and runs fast on mobile WebGPU
        const selectedModel = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC"; 

        let engine;

        async function initAI() {
            try {
                statusDiv.innerText = "Loading model into browser memory... (Requires internet on first run)";
                
                // Spin up the WebGPU engine inside a web worker to keep the interface smooth
                engine = await CreateWebWorkerEngine(
                    new Worker(new URL("https://jsdelivr.net", import.meta.url)),
                    selectedModel,
                    {
                        initProgressCallback: (report) => {
                            statusDiv.innerText = report.text;
                        }
                    }
                );

                statusDiv.innerText = "Model Ready! You can now disconnect from the internet.";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.style.background = "#8b0000";
                statusDiv.innerText = "Error: WebGPU might be disabled or unsupported in this browser view.";
                console.error(err);
            }
        }

        async function appendMessage(text, sender) {
            const msg = document.createElement("div");
            msg.className = `msg ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = "";
            await appendMessage(prompt, "user");

            userInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.innerText = "AI is thinking...";

            const aiMsgBox = await appendMessage("", "ai");

            try {
                const chunks = await engine.chat.completions.create({
                    messages: [{ role: "user", content: prompt }],
                    stream: true
                });

                let replyText = "";
                for await (const chunk of chunks) {
                    const content = chunk.choices[0]?.delta?.content || "";
                    replyText += content;
                    aiMsgBox.innerText = replyText;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (e) {
                aiMsgBox.innerText = "Error generating response. Ensure you are utilizing a secure context (HTTPS) or local file access.";
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
            statusDiv.innerText = "Offline Mode Active";
        }

        sendBtn.addEventListener("click", handleSend);
        userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleSend(); });

        // Initialize when the page loads
        initAI();
    </script>
</body>
</html>
