<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S25 Personal WASM AI</title>
    <style>
        :root { --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --accent: #a8c7fa; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #303132; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #303132; color: #fff; }
        .ai { align-self: flex-start; background: var(--card); border: 1px solid #444746; }
        #input-area { padding: 15px; display: flex; gap: 10px; background: var(--bg); border-top: 1px solid #303132; }
        input { flex: 1; padding: 14px; border: 1px solid #444746; border-radius: 25px; background: var(--card); color: white; font-size: 16px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; }
        #status { padding: 8px; font-size: 12px; text-align: center; background: #282a2d; color: #aaa; }
    </style>
</head>
<body>

    <header>S25 Personal WASM AI</header>
    <div id="status">Initializing Virtual Environment...</div>
    <div id="chat-box">
        <div class="msg ai">Sandbox environment verified! Your phone is compiling the processing matrix in a secure background thread. Connect to the internet to stream the core engine variables.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <script>
        const statusDiv = document.getElementById("status");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        // We create an inline background execution loop to isolate calculations completely
        const workerCode = `
            import { pipeline } from 'https://jsdelivr.net';
            
            let generator = null;

            self.onmessage = async function(e) {
                const { type, text } = e.data;
                
                if (type === 'INIT') {
                    try {
                        generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                            progress_callback: (data) => {
                                if (data.status === 'progress') {
                                    self.postMessage({ type: 'PROGRESS', value: data.progress });
                                }
                            }
                        });
                        self.postMessage({ type: 'READY' });
                    } catch (err) {
                        self.postMessage({ type: 'ERROR', error: err.message });
                    }
                } else if (type === 'GENERATE') {
                    try {
                        const output = await generator(text, {
                            max_new_tokens: 128,
                            temperature: 0.7,
                        });
                        const cleanText = output[0].generated_text.replace(text, '').trim();
                        self.postMessage({ type: 'RESULT', text: cleanText });
                    } catch (err) {
                        self.postMessage({ type: 'ERROR', error: err.message });
                    }
                }
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        const aiWorker = new Worker(workerUrl, { type: 'module' });

        aiWorker.onmessage = function(e) {
            const { type, value, text, error } = e.data;

            if (type === 'PROGRESS') {
                statusDiv.innerText = `Downloading Engine Modules: ${Math.round(value)}%`;
            } else if (type === 'READY') {
                statusDiv.innerText = "Engine Locked. Safe to disconnect network.";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else if (type === 'RESULT') {
                updateAIChat(text);
            } else if (type === 'ERROR') {
                statusDiv.innerText = "Compilation Exception Dropped.";
                console.error("Worker Thread Error: ", error);
            }
        };

        function updateAIChat(reply) {
            const lastMsg = chatBox.lastElementChild;
            if (lastMsg && lastMsg.classList.contains('ai') && lastMsg.innerText === "Thinking...") {
                lastMsg.innerText = reply || "Data stream parsed successfully.";
            } else {
                appendMessage(reply, 'ai');
            }
            userInput.disabled = false;
            sendBtn.disabled = false;
            statusDiv.innerText = "Offline Mode Active";
        }

        async function appendMessage(text, sender) {
            const msg = document.createElement("div");
            msg.className = `msg ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = "";
            await appendMessage(prompt, "user");

            userInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.innerText = "AI is computing mathematical chains...";

            await appendMessage("Thinking...", "ai");
            aiWorker.postMessage({ type: 'GENERATE', text: prompt });
        }

        sendBtn.addEventListener("click", handleSend);
        userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleSend(); });

        // Kickstart the background execution layer immediately on page render
        statusDiv.innerText = "Spawning Background Virtual Sandbox...";
        aiWorker.postMessage({ type: 'INIT' });
    </script>
</body>
</html>
