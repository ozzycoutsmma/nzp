<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S25 Personal Web AI</title>
    <style>
        :root { --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --accent: #a8c7fa; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #303132; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #303132; color: #fff; }
        .ai { align-self: flex-start; background: var(--card); border: 1px solid #444746; }
        #input-area { padding: 15px; display: flex; gap: 10px; background: var(--bg); border-top: 1px solid #303132; }
        input { flex: 1; padding: 14px; border: 1px solid #444746; border-radius: 25px; background: var(--card); color: white; font-size: 16px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; }
        #status { padding: 8px; font-size: 12px; text-align: center; background: #282a2d; color: #aaa; }
    </style>
</head>
<body>

    <header>S25 Personal Web AI</header>
    <div id="status">Loading AI Brain... (Connect to Internet for first load)</div>
    <div id="chat-box">
        <div class="msg ai">Interface loaded! Once the top bar says "Model Ready", you can turn on Airplane Mode and talk to me 100% offline.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <!-- We load a lightweight, main-thread-safe distribution of the model processor -->
    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';

        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const statusDiv = document.getElementById("status");

        let pipe;

        async function initAI() {
            try {
                // Instantiates a highly compressed conversational text model (~45MB)
                pipe = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                
                statusDiv.innerText = "Model Ready! Safe to use offline.";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "Model load failed. Check internet connection.";
                console.error(err);
            }
        }

        async function appendMessage(text, sender) {
            const msg = document.createElement("div");
            msg.className = `msg ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = "";
            await appendMessage(prompt, "user");

            userInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.innerText = "AI is thinking...";

            const aiMsgBox = await appendMessage("Thinking...", "ai");

            try {
                // Generate a real response using the loaded AI model weights
                const out = await pipe(prompt, { max_new_tokens: 60, temperature: 0.7 });
                const reply = out[0].generated_text.replace(prompt, '').trim();
                
                aiMsgBox.innerText = reply || "I understand. Please tell me more.";
            } catch (e) {
                aiMsgBox.innerText = "Error calculating response.";
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
            statusDiv.innerText = "Offline Mode Active";
        }

        sendBtn.addEventListener("click", handleSend);
        userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleSend(); });

        initAI();
    </script>
</body>
</html>
