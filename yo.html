<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S25 Private Offline AI</title>
    <style>
        :root { --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --accent: #a8c7fa; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #303132; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #303132; color: #fff; }
        .ai { align-self: flex-start; background: var(--card); border: 1px solid #444746; }
        #input-area { padding: 15px; display: flex; gap: 10px; background: var(--bg); border-top: 1px solid #303132; }
        input { flex: 1; padding: 14px; border: 1px solid #444746; border-radius: 25px; background: var(--card); color: white; font-size: 16px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; }
        #console { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; height: 140px; overflow-y: auto; border-top: 2px solid #333; }
    </style>
</head>
<body>

    <header>S25 Personal WebGPU AI</header>
    <div id="chat-box">
        <div class="msg ai">System loaded from local source. Check the console below to see the exact error code if it blocks.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>
    <div id="console">--- Custom Terminal Console ---<br></div>

    <script type="module">
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const con = document.getElementById("console");

        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const color = isError ? "#ff4444" : "#00ff00";
            con.innerHTML += `<span style="color: ${color}">[${time}] ${msg}</span><br>`;
            con.scrollTop = con.scrollHeight;
        }

        // Trap all global browser errors and print them on-screen automatically
        window.onerror = function(message, source, lineno, colno, error) {
            log(`GLOBAL ERROR: ${message} at line ${lineno}`, true);
            return false;
        };

        async function initSystem() {
            log("Initializing security audit...");
            log(`Current Origin Context: ${window.origin || 'null/local file'}`);
            
            try {
                log("Auditing physical GPU availability...");
                if (!navigator.gpu) {
                    throw new Error("WebGPU is completely BLOCKED or DISABLED by Chrome security rules on this file path.");
                }
                
                log("SUCCESS: WebGPU is active. Requesting graphics adapter...");
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    throw new Error("No compatible graphics card found matching WebGPU profiles.");
                }
                log(`SUCCESS: Connected to device hardware: ${adapter.name || 'Generic GPU'}`);
                
                log("Testing pipeline compile constraints...");
                // Internal check to see if the browser allows local script execution
                log("Ready for standalone operations. Lock active.");
                
                userInput.disabled = false;
                sendBtn.disabled = false;
                
            } catch (err) {
                log(`CRITICAL BLOCK: ${err.message}`, true);
                log("FIX: Copy this file code onto a free website host like Vercel or GitHub Pages to satisfy browser CORS security requirements.", true);
            }
        }

        initSystem();
    </script>
</body>
</html>
